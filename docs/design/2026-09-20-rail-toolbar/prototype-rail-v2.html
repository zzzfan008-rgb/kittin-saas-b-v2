<!doctype html>
<html lang="zh-CN" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garment Canvas · 左侧工具栏 V2（工作流分组）</title>
<style>
/* ============================================================
   左侧工具栏 V2
   主胶囊 6 项:
   1 添加(文本/图片/视频/资产库) 2 AI换装工作流(5项)
   3 服装设计工作流(6项) 4 视频生成工作流(4项)
   5 AI画板  6 色彩工具
   历史胶囊: 撤销/重做
   规则:白卡浮层(三主题同形)、四层软阴影、accent 只落 active/焦点、
        线性图标 1.8 描边、组内分隔线
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font:"SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --d1:120ms; --d2:220ms;
}
[data-theme="obsidian"]{
  --canvas:#16181d; --canvas-dot:#2a2d34;
  --rail-bg:#ffffff; --rail-border:#e4e6ea;
  --ink:#1d1d1f; --muted:#9aa0a8;
  --hover:#f2f3f5; --divider:#e8eaee;
  --accent:#B7F35A; --accent-ink:#131313; --accent-deep:#5a8f1f;
  --rail-shadow:0 0 0 .5px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.28),0 10px 24px rgba(0,0,0,.32),0 24px 52px rgba(0,0,0,.4);
  --menu-shadow:0 0 0 .5px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.24),0 16px 40px rgba(0,0,0,.34);
}
[data-theme="apple"]{
  --canvas:#f5f5f7; --canvas-dot:#e3e4e8;
  --rail-bg:#ffffff; --rail-border:rgba(0,0,0,.08);
  --ink:#1d1d1f; --muted:#8e8e93;
  --hover:#f5f5f7; --divider:rgba(0,0,0,.07);
  --accent:#0071e3; --accent-ink:#fff; --accent-deep:#0071e3;
  --rail-shadow:0 .5px 0 rgba(0,0,0,.04),0 2px 6px rgba(0,0,0,.06),0 10px 24px rgba(0,0,0,.08),0 24px 52px rgba(0,0,0,.1);
  --menu-shadow:0 .5px 0 rgba(0,0,0,.04),0 4px 10px rgba(0,0,0,.1),0 16px 40px rgba(0,0,0,.12);
}
[data-theme="eye"]{
  --canvas:#E9F1EA; --canvas-dot:#d3ddd4;
  --rail-bg:#ffffff; --rail-border:#e2ece4;
  --ink:#123B2B; --muted:#77907f;
  --hover:#f0f6f1; --divider:#e6ede8;
  --accent:#0B7A43; --accent-ink:#fff; --accent-deep:#0B7A43;
  --rail-shadow:0 .5px 0 rgba(18,59,43,.05),0 2px 6px rgba(18,59,43,.07),0 10px 24px rgba(18,59,43,.09),0 24px 52px rgba(18,59,43,.12);
  --menu-shadow:0 .5px 0 rgba(18,59,43,.05),0 4px 10px rgba(18,59,43,.1),0 16px 40px rgba(18,59,43,.13);
}
html,body{height:100%}
body{font-family:var(--font);background:var(--canvas);overflow:hidden;position:relative}
.canvas-dots{position:absolute;inset:0;
  background:radial-gradient(circle,var(--canvas-dot) 1px,transparent 1.3px) 0 0/26px 26px}

/* ===== 主工具胶囊 ===== */
.rail{position:absolute;left:16px;top:16px;z-index:30;
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px;
  background:var(--rail-bg);border:1px solid var(--rail-border);
  border-radius:20px;box-shadow:var(--rail-shadow)}
.rail-history{top:auto;bottom:16px}

.tool{position:relative;width:40px;height:40px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:none;border-radius:12px;background:transparent;color:var(--muted);
  cursor:pointer;transition:background var(--d1) var(--ease),color var(--d1) var(--ease),transform var(--d1) var(--ease)}
.tool svg{width:21px;height:21px;stroke-width:1.8}
/* hover 底色 = 主题色实底;图标/文字转为对比色保证可读 */
.tool:hover{background:var(--accent);color:var(--accent-ink)}
.tool:hover svg{color:var(--accent-ink)}
.tool:active{transform:scale(.93)}
.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool:disabled{opacity:.32;cursor:not-allowed}
.tool:disabled:hover{background:transparent;color:var(--muted)}
.tool:disabled:hover svg{color:var(--muted)}
.tool.active{background:var(--accent);color:var(--accent-ink)}
.tool.active svg{color:var(--accent-ink)}
.tool.active:hover{background:var(--accent)}
/* 有菜单的工具:右侧小箭头也跟随主题色 */
.tool .caret{position:absolute;right:3px;bottom:3px;width:8px;height:8px;
  color:var(--muted);opacity:.7}
.tool:hover .caret{opacity:1;color:var(--accent-ink)}
/* 主操作「添加」圆钮 */
.tool-primary{border-radius:50%;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent);margin-bottom:3px}
.tool-primary:hover{background:var(--accent);filter:brightness(1.06);color:var(--accent-ink)}
.tool-primary svg{width:22px;height:22px;stroke-width:2.2}
.rail-sep{width:22px;height:1px;margin:5px 0;background:var(--divider)}

/* tooltip */
.tip{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(-4px);
  padding:5px 9px;border-radius:8px;background:rgba(20,22,26,.92);color:#fff;
  font-size:11.5px;white-space:nowrap;letter-spacing:-.1px;opacity:0;pointer-events:none;
  transition:opacity var(--d1) var(--ease),transform var(--d1) var(--ease);z-index:60}
.tool:hover .tip,.tool:focus-visible .tip{opacity:1;transform:translateY(-50%) translateX(0)}
.tool:disabled:hover .tip{display:none}

/* ===== 工作流弹出菜单 =====
   交互:鼠标移到工具项即自动弹出(无需点击),移开工具项或菜单即自动关闭;
   键盘 focus 同样展开 */
.menu{position:absolute;left:68px;z-index:40;width:218px;padding:6px;max-height:calc(100vh - 120px);overflow-y:auto;
  background:var(--rail-bg);border:1px solid var(--rail-border);border-radius:16px;
  box-shadow:var(--menu-shadow);
  opacity:0;visibility:hidden;transform:translateX(-6px) scale(.98);pointer-events:none;transform-origin:left center;
  transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease),visibility 0s linear var(--d2)}
.menu.open{opacity:1;visibility:visible;transform:translateX(0) scale(1);pointer-events:auto;transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease),visibility 0s}
.menu::before{content:"";position:absolute;left:-6px;top:var(--arrow,18px);width:11px;height:11px;
  background:var(--rail-bg);border-left:1px solid var(--rail-border);
  border-bottom:1px solid var(--rail-border);transform:rotate(45deg);border-bottom-left-radius:3px}
.menu h4{padding:7px 10px 5px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  border:none;border-radius:10px;background:transparent;color:var(--ink);
  font-size:13px;font-family:inherit;text-align:left;cursor:pointer;
  transition:background var(--d1) var(--ease),color var(--d1) var(--ease)}
/* hover 底色=主题色实底;图标与文字转为对比色保证可读 */
.menu-item:hover{background:var(--accent);color:var(--accent-ink)}
.menu-item:hover .mi-ico{color:var(--accent-ink)}
.menu-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.menu-item .mi-ico{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:transparent;color:var(--muted);transition:color var(--d1) var(--ease)}
.menu-item .mi-ico svg{width:16px;height:16px;stroke-width:1.8}
.menu-item .mi-label{flex:1;letter-spacing:-.1px}

/* 主题切换(原型用) */
.themes{position:fixed;top:16px;right:16px;z-index:50;display:flex;gap:8px}
.tp{font-size:11px;font-family:var(--mono);padding:6px 12px;border-radius:999px;
  border:1px solid var(--rail-border);background:var(--rail-bg);color:var(--muted);cursor:pointer;
  transition:all var(--d1) var(--ease)}
.tp.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
</style>
</head>

  <!-- 6 色彩工具 -->
  <button class="tool">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-1.5-1-2-1-3 0-1 .8-2 2-2h2a4 4 0 0 0 4-4c0-3.9-4-7-9-7z"/>
      <circle cx="7.5" cy="11" r="1.1"/><circle cx="10" cy="7.5" r="1.1"/><circle cx="14.5" cy="7.5" r="1.1"/>
    </svg>
    <span class="tip">色彩工具</span>
  </button>
</nav>

<!-- 历史组 -->

<script>
document.querySelectorAll('.tp').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tp').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');document.documentElement.dataset.theme=b.dataset.t;
}));

/* hover 自动弹出/关闭
   - 鼠标移入工具项:120ms 后展开对应菜单(防快速划过误触)
   - 鼠标移出:200ms 宽限后关闭,期间鼠标移到菜单上则保持
   - 键盘 focus 立即展开,blur 关闭
   - 同一时间只有一个菜单 */
const tools=[...document.querySelectorAll('.tool[data-menu]')];
const menus=[...document.querySelectorAll('.menu')];
let openMenu=null, openTimer=null, closeTimer=null;

function clearTimers(){clearTimeout(openTimer);clearTimeout(closeTimer);}
function showMenu(menu, tool){
  clearTimers();
  if(openMenu===menu) return;
  closeAllNow();
  menu.classList.add('open');
  tool.classList.add('active');
  tool.setAttribute('aria-expanded','true');
  openMenu=menu;
}
function closeAllNow(){
  menus.forEach(m=>m.classList.remove('open'));
  tools.forEach(t=>{t.classList.remove('active');t.setAttribute('aria-expanded','false');});
  openMenu=null;
}
function scheduleClose(){
  clearTimers();
  closeTimer=setTimeout(closeAllNow,200);
}
function cancelClose(){clearTimeout(closeTimer);}

tools.forEach(tool=>{
  const menu=document.getElementById(tool.dataset.menu);
  tool.addEventListener('mouseenter',()=>{
    clearTimers();
    openTimer=setTimeout(()=>showMenu(menu,tool),120);
  });
  tool.addEventListener('mouseleave',scheduleClose);
  tool.addEventListener('focus',()=>showMenu(menu,tool));
  tool.addEventListener('click',()=>showMenu(menu,tool)); // 点击也立即展开(触屏兜底)
  menu.addEventListener('mouseenter',cancelClose);
  menu.addEventListener('mouseleave',scheduleClose);
});
</script>
</body>
</html>
