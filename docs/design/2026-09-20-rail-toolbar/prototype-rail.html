<!doctype html>
<html lang="zh-CN" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garment Canvas · 左侧工具栏 V1</title>
<style>
/* ============================================================
   左侧工具栏 · 悬浮胶囊
   参考:双胶囊竖条(主工具组 + 历史组) + 短分隔线
   规则:白卡浮层语言(三主题同形白卡/panel)、四层软阴影、
        accent 只落在 active/焦点、线性图标 1.8 描边
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font:"SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --d1:120ms;--d2:220ms;
}
[data-theme="obsidian"]{
  --canvas:#16181d; --canvas-dot:#2a2d34;
  --rail-bg:#ffffff; --rail-border:#e4e6ea;
  --ink:#1d1d1f; --muted:#9aa0a8;
  --hover:#f2f3f5; --divider:#e8eaee;
  --accent:#B7F35A; --accent-ink:#131313;
  --rail-shadow:0 0 0 .5px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.28),0 10px 24px rgba(0,0,0,.32),0 24px 52px rgba(0,0,0,.4);
}
[data-theme="apple"]{
  --canvas:#f5f5f7; --canvas-dot:#e3e4e8;
  --rail-bg:#ffffff; --rail-border:rgba(0,0,0,.08);
  --ink:#1d1d1f; --muted:#8e8e93;
  --hover:#f5f5f7; --divider:rgba(0,0,0,.07);
  --accent:#0071e3; --accent-ink:#ffffff;
  --rail-shadow:0 .5px 0 rgba(0,0,0,.04),0 2px 6px rgba(0,0,0,.06),0 10px 24px rgba(0,0,0,.08),0 24px 52px rgba(0,0,0,.1);
}
[data-theme="eye"]{
  --canvas:#E9F1EA; --canvas-dot:#d3ddd4;
  --rail-bg:#ffffff; --rail-border:#e2ece4;
  --ink:#123B2B; --muted:#77907f;
  --hover:#f0f6f1; --divider:#e6ede8;
  --accent:#0B7A43; --accent-ink:#ffffff;
  --rail-shadow:0 .5px 0 rgba(18,59,43,.05),0 2px 6px rgba(18,59,43,.07),0 10px 24px rgba(18,59,43,.09),0 24px 52px rgba(18,59,43,.12);
}
html,body{height:100%}
body{font-family:var(--font);background:var(--canvas);overflow:hidden;position:relative}

/* 画布点阵 */
.canvas-dots{
  position:absolute;inset:0;
  background:radial-gradient(circle,var(--canvas-dot) 1px,transparent 1.3px) 0 0/26px 26px;
}

/* ===== 悬浮工具栏(主工具组) ===== */
.rail{
  position:absolute;left:16px;top:16px;z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px;
  background:var(--rail-bg);
  border:1px solid var(--rail-border);
  border-radius:20px;
  box-shadow:var(--rail-shadow);
}
/* 历史组(独立胶囊,与主组留白) */
.rail-history{top:auto;bottom:16px}

/* 工具按钮 */
.tool{
  position:relative;
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border:none;border-radius:12px;
  background:transparent;color:var(--muted);
  cursor:pointer;
  transition:background var(--d1) var(--ease),color var(--d1) var(--ease),transform var(--d1) var(--ease);
}
.tool svg{width:21px;height:21px;stroke-width:1.8}
.tool:hover{background:var(--hover);color:var(--ink)}
.tool:active{transform:scale(.94)}
.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool:disabled{opacity:.32;cursor:not-allowed;background:transparent;color:var(--muted)}
.tool.active{background:var(--hover);color:var(--accent)}
[data-theme="obsidian"] .tool.active{color:#5a8f1f}
[data-theme="eye"] .tool.active{color:var(--accent)}

/* 主操作圆钮(+)——参考图的唯一高饱和焦点 */
.tool-primary{
  width:40px;height:40px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent);
}
.tool-primary:hover{background:var(--accent);filter:brightness(1.06);color:var(--accent-ink)}
.tool-primary svg{width:22px;height:22px;stroke-width:2.2}

/* 短分隔线 */
.rail-sep{
  width:22px;height:1px;margin:4px 0;
  background:var(--divider);
}

/* tooltip */
.tool .tip{
  position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(-4px);
  padding:5px 9px;border-radius:8px;
  background:rgba(20,22,26,.92);color:#fff;
  font-size:11.5px;white-space:nowrap;letter-spacing:-.1px;
  opacity:0;pointer-events:none;
  transition:opacity var(--d1) var(--ease),transform var(--d1) var(--ease);
  z-index:30;
}
.tool:hover .tip,.tool:focus-visible .tip{opacity:1;transform:translateY(-50%) translateX(0)}
.tool:disabled:hover .tip{display:none}
.tool .tip kbd{
  margin-left:6px;padding:1px 4px;border-radius:4px;
  background:rgba(255,255,255,.14);
  font-family:var(--mono);font-size:10px;
}

/* 角标(节点库数量提示)——中性色,不与主圆钮抢 accent 焦点 */
.badge{
  position:absolute;top:5px;right:5px;
  min-width:15px;height:15px;padding:0 4px;
  border-radius:999px;
  background:var(--muted);color:var(--rail-bg);
  font-size:9px;font-weight:700;line-height:15px;text-align:center;
}

/* ===== 弹出的「添加」菜单(参考图二级面板) ===== */
.popover{
  position:absolute;left:76px;top:16px;z-index:20;
  width:216px;padding:6px;
  background:var(--rail-bg);
  border:1px solid var(--rail-border);
  border-radius:16px;
  box-shadow:var(--rail-shadow);
  opacity:0;transform:translateX(-6px) scale(.98);pointer-events:none;
  transform-origin:left center;
  transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease);
}
/* 指向主圆钮的小箭头 */
.popover::before{
  content:"";position:absolute;left:-6px;top:14px;
  width:11px;height:11px;
  background:var(--rail-bg);
  border-left:1px solid var(--rail-border);
  border-bottom:1px solid var(--rail-border);
  transform:rotate(45deg);
  border-bottom-left-radius:3px;
}
.popover.open{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.popover h4{
  padding:7px 10px 5px;
  font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;
}
.menu-item{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:8px 10px;
  border:none;border-radius:10px;
  background:transparent;color:var(--ink);
  font-size:13px;font-family:inherit;text-align:left;cursor:pointer;
  transition:background var(--d1) var(--ease);
}
.menu-item:hover{background:var(--hover)}
.menu-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.menu-item .mi-icon{
  width:28px;height:28px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:var(--hover);color:var(--muted);
}
.menu-item .mi-icon svg{width:16px;height:16px;stroke-width:1.8}
.menu-item .mi-label{flex:1}
.menu-item .mi-kbd{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  border:1px solid var(--divider);border-radius:5px;padding:1px 5px;
}

/* 主题切换器(原型用) */
.themes{position:fixed;top:16px;right:16px;z-index:50;display:flex;gap:8px}
.tp{font-size:11px;font-family:var(--mono);padding:6px 12px;border-radius:999px;
  border:1px solid var(--rail-border);background:var(--rail-bg);color:var(--muted);
  cursor:pointer;transition:all var(--d1) var(--ease)}
.tp.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}

/* 标注 */
.note{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;
  font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.02em;
  background:color-mix(in srgb,var(--rail-bg) 85%,transparent);
  padding:6px 14px;border-radius:999px;border:1px solid var(--rail-border);
  backdrop-filter:blur(8px)}
</style>
</head>
<body>

<div class="canvas-dots"></div>

<div class="themes">
  <button class="tp on" data-t="obsidian">曜黑</button>
  <button class="tp" data-t="apple">简白</button>
  <button class="tp" data-t="eye">护眼绿</button>
</div>

<!-- 主工具组 -->
<nav class="rail" aria-label="工作台左侧工具">
  <button class="tool tool-primary" id="addBtn" aria-haspopup="menu" aria-expanded="true" aria-controls="addMenu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span class="tip">添加节点 <kbd>N</kbd></span>
  </button>

  <span class="rail-sep" role="separator"></span>

  <button class="tool active" aria-pressed="true" aria-controls="workbench-library-panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h5l2 3h9v11H4z"/><path d="M9 12h7M9 16h5"/>
    </svg>
    <span class="tip">节点库</span>
    <span class="badge">8</span>
  </button>

  <button class="tool" aria-pressed="false" aria-controls="workbench-inspector-panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h13M4 6v0M18 18h2"/>
      <circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="19" cy="18" r="2.2"/>
    </svg>
    <span class="tip">属性 / 结果</span>
  </button>

  <span class="rail-sep" role="separator"></span>

  <button class="tool">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12l7 7 7-7M5 5h6"/>
    </svg>
    <span class="tip">运行全部 <kbd>⌘↵</kbd></span>
  </button>
</nav>

<!-- 添加菜单 -->
<div class="popover open" id="addMenu" role="menu" aria-label="添加节点">
  <h4>添加</h4>
  <button class="menu-item" role="menuitem">
    <span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/></svg></span>
    <span class="mi-label">插入文本节点</span>
    <span class="mi-kbd">T</span>
  </button>
  <button class="menu-item" role="menuitem">
    <span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4 4 3 3-2 4 3"/></svg></span>
    <span class="mi-label">本地上传图片</span>
  </button>
  <button class="menu-item" role="menuitem">
    <span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="m17 10 4-2v8l-4-2z"/><path d="M7 14h2"/></svg></span>
    <span class="mi-label">本地上传视频</span>
  </button>
  <button class="menu-item" role="menuitem">
    <span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3z"/><path d="m7 13 3-3 3 2 4-4"/></svg></span>
    <span class="mi-label">从素材库选择</span>
  </button>
</div>

<!-- 历史组(独立胶囊) -->
<nav class="rail rail-history" aria-label="操作历史">
  <button class="tool" aria-label="撤销">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H8"/>
    </svg>
    <span class="tip">撤销 <kbd>⌘Z</kbd></span>
  </button>
  <button class="tool" disabled aria-disabled="true" aria-label="重做">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0-5 5v0a5 5 0 0 0 5 5h7"/>
    </svg>
    <span class="tip">重做 <kbd>⌘⇧Z</kbd></span>
  </button>
</nav>

<div class="note">悬浮胶囊 · 主工具组 / 历史组分离 · 三主题切换查看</div>

<script>
document.querySelectorAll('.tp').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tp').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  document.documentElement.dataset.theme=b.dataset.t;
}));
const add=document.getElementById('addBtn'),menu=document.getElementById('addMenu');
add.addEventListener('click',()=>{
  const open=menu.classList.toggle('open');
  add.setAttribute('aria-expanded',open);
});
</script>
</body>
</html>
