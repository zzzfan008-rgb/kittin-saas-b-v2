# 局域网部署覆盖层：前端入口 nginx（8080）→ 后端 app（宿主 3003 / 容器 3002）
# 用法：docker compose -f compose.yaml -f compose.lan.yaml up -d --build --wait
services:
  app:
    build:
      args:
        # 国内网络改走镜像站；本机已缓存该镜像，构建时无需再拉取
        NODE_IMAGE: docker.m.daocloud.io/library/node:24.20.0-bookworm-slim

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/lan.conf:/etc/nginx/conf.d/default.conf:ro
